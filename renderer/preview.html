<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>Mayuka preview</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; display: grid; place-items: center; }
      /* Pixi writes an inline pixel size; the page is square, so force the canvas to fill it. */
      canvas { width: min(100vw, 100vh) !important; height: min(100vw, 100vh) !important; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
